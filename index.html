<!DOCTYPE html>
<html lang="ja">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.4rem;
            margin-bottom: 5px;
            color: #e0e0e0;
        }
        h2 {
            font-size: 1.5rem;
            margin: 30px 0 15px 0;
            color: #cccccc;
        }
        p.subtitle {
            font-size: 1.15rem;
            color: #888888;
            margin-bottom: 25px;
        }
        .section-container {
            width: 100%;
            max-width: 760px;
            margin-bottom: 40px;
        }
        .media-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0,0,0,0.85);
            background: #000;
            margin-bottom: 15px;
        }
        .media-wrapper video,
        .media-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        .lang-select-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .lang-select-container a {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            background-color: #1f1f1f;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .lang-select-container a:hover {
            background-color: #333;
            border-color: #777;
            transform: translateY(-2px);
        }
    </style>
</head>
