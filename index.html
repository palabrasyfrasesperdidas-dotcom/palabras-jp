<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>言葉と失われたフレーズ | Palabras y frases perdidas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            padding: 10px 15px;
            text-align: center;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 2px;
            color: #e0e0e0;
        }
        p.subtitle {
            font-size: 0.85rem;
            color: #888888;
            margin-bottom: 8px;
        }
        /* Barra de navegación ultracompacta */
        .nav-bar {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 700px;
        }
        .nav-bar a, .nav-bar select, .nav-bar button {
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: #1f1f1f;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
        }
        .nav-bar a:hover, .nav-bar button:hover {
            background-color: #333;
            border-color: #777;
            transform: translateY(-1px);
        }
        .nav-bar select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-right: 25px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 12px;
        }
        .nav-bar select option {
            background-color: #1f1f1f;
            color: #fff;
        }
        .section-container {
            width: 100%;
            max-width: 520px;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 1.05rem;
            margin: 0 0 6px 0;
            color: #cccccc;
        }
        .media-wrapper {
            position: relative;
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.85);
            background: #000;
        }
        .media-wrapper video,
        .media-wrapper img {
            width: 100%;
            height: auto;
            max-height: 52vh;
            display: block;
            object-fit: contain;
        }
        /* Frases superpuestas elegantes */
        .frases-overlay {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 12px;
            border-radius: 5px;
            backdrop-filter: blur(4px);
            z-index: 10;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
        }
        .frases-overlay ul {
            list-style-type: none;
            padding-left: 0;
            margin: 0;
        }
        .frases-overlay li {
            font-size: 0.8rem;
            color: #f1f1f1;
            line-height: 1.3;
            margin-bottom: 4px;
        }
        .frases-overlay li:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <h1>言葉と失われたフレーズ</h1>
    <p class="subtitle">足跡と考察のコレクション</p>

    <!-- Barra de navegación -->
    <div class="nav-bar">
        <a href="https://palabrasyfrasesperdidas-dotcom.github.io/palabrasyfrasesperdidas/">🏠 Home</a>
        <select id="blockSelect" onchange="changeBlock(this.value)">
            <!-- Se rellenará dinámicamente -->
        </select>
        <button onclick="prevBlock()">← 戻る</button>
        <button onclick="nextBlock()">次へ →</button>
        <button onclick="randomBlock()">🎲 ランダム</button>
    </div>

    <div class="section-container" id="contentContainer">
        <!-- Contenido dinámico -->
    </div>

    <script>
        let bloquesData = {};
        let currentBlockId = 1;
        const totalBlocks = 18;

        const blockTitlesJP = {
            1: "第1ブロック：運命の幾何学",
            2: "第2ブロック：魂の建築",
            3: "第3ブロック：沈黙の解剖学",
            4: "第4ブロック：恐れとその影",
            5: "第5ブロック：世界のまなざし",
            6: "第6ブロック：愚者たちのざわめき",
            7: "第7ブロック：星々の天蓋",
            8: "第8ブロック：心の倫理",
            9: "第9ブロック：息づく時間",
            10: "第10ブロック：生きることの遊戯",
            11: "第11ブロック：自由の鼓動",
            12: "第12ブロック：思考の解剖学",
            13: "第13ブロック：言葉の宇宙",
            14: "第14ブロック：語りかける孤独",
            15: "第15ブロック：記憶の回廊",
            16: "第16ブロック：希望の地平",
            17: "第17ブロック：影の王国",
            18: "第18ブロック：永遠の足跡"
        };

        fetch('frases.json')
            .then(response => response.json())
            .then(data => {
                data.forEach(item => {
                    if (!bloquesData[item.bloque]) {
                        bloquesData[item.bloque] = [];
                    }
                    bloquesData[item.bloque].push(item.texto);
                });
                initSelect();
                displayBlock(currentBlockId);
            })
            .catch(error => console.error('Error al cargar frases.json:', error));

        function initSelect() {
            const select = document.getElementById('blockSelect');
            select.innerHTML = '';
            for (let i = 1; i <= totalBlocks; i++) {
                let option = document.createElement('option');
                option.value = i;
                option.textContent = blockTitlesJP[i] || `第${i}ブロック`;
                select.appendChild(option);
            }
        }

        function displayBlock(id) {
            currentBlockId = parseInt(id);
            document.getElementById('blockSelect').value = currentBlockId;
            
            const container = document.getElementById('contentContainer');
            const frases = bloquesData[currentBlockId] || [];
            
            let frasesHtml = '';
            if (frases.length > 0) {
                frasesHtml = `
                    <div class="frases-overlay">
                        <ul>
                            ${frases.map(f => `<li>${f}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            container.innerHTML = `
                <h2>${blockTitlesJP[currentBlockId]}</h2>
                <div class="media-wrapper">
                    <video id="blockVideo" controls autoplay loop muted src="plantilla${currentBlockId}_video_jp.mp4" onerror="handleVideoError()"></video>
                    <img id="blockImg" src="plantilla${currentBlockId}_jp.png" alt="Plantilla ${currentBlockId}" style="display:none;">
                    ${frasesHtml}
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleVideoError() {
            const video = document.getElementById('blockVideo');
            const img = document.getElementById('blockImg');
            if (video) video.style.display = 'none';
            if (img) img.style.display = 'block';
        }

        function changeBlock(val) {
            displayBlock(val);
        }

        function nextBlock() {
            currentBlockId = currentBlockId < totalBlocks ? currentBlockId + 1 : 1;
            displayBlock(currentBlockId);
        }

        function prevBlock() {
            currentBlockId = currentBlockId > 1 ? currentBlockId - 1 : totalBlocks;
            displayBlock(currentBlockId);
        }

        function randomBlock() {
            let randomId;
            do {
                randomId = Math.floor(Math.random() * totalBlocks) + 1;
            } while (randomId === currentBlockId && totalBlocks > 1);
            displayBlock(randomId);
        }
    </script>
</body>
</html>
