<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>言葉と失われたフレーズ</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #e0e0e0;
        }
        p.subtitle {
            font-size: 1rem;
            color: #888888;
        }
        .viewer-section {
            display: flex;
            width: 100%;
            max-width: 900px;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            width: 100%;
        }
        select, button {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 10px 16px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            touch-action: manipulation;
            font-family: 'Montserrat', sans-serif;
        }
        select:hover, button:hover:not(:disabled) {
            background-color: #2a2a2a;
            border-color: #555555;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        .info-panel {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 480px;
            font-size: 0.9rem;
            color: #aaaaaa;
        }
        #loading {
            position: absolute;
            color: #ffffff;
            font-size: 1.1rem;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <h1>言葉と失われたフレーズ</h1>
        <p class="subtitle">足跡と考察のコレクション</p>
    </header>

    <div class="viewer-section">
        <div class="controls">
            <button id="homeBtn">🏠 Home</button>
            <select id="blockSelect"></select>
            <button id="prevBtn">&larr; 前へ</button>
            <button id="nextBtn">次へ &rarr;</button>
            <button id="randomBtn">🎲 ランダム</button>
        </div>

        <div class="canvas-container">
            <div id="loading">読み込み中...</div>
            <canvas id="cardCanvas"></canvas>
        </div>

        <div class="info-panel">
            <span id="huellaCounter">--</span>
        </div>
    </div>

<script>
    const blockNamesJP = [
        "第1ブロック：運命の幾何学",
        "第2ブロック：魂の建築",
        "第3ブロック：沈黙の解剖学",
        "第4ブロック：恐れとその影",
        "第5ブロック：世界のまなざし",
        "第6ブロック：愚者たちのざわめき",
        "第7ブロック：星々の天蓋",
        "第8ブロック：心の倫理",
        "第9ブロック：息づく時間",
        "第10ブロック：生きることの遊戯",
        "第11ブロック：自由の鼓動",
        "第12ブロック：思考の解剖学",
        "第13ブロック：言葉の宇宙",
        "第14ブロック：語りかける孤独",
        "第15ブロック：記憶の回廊",
        "第16ブロック：希望の地平",
        "第17ブロック：影の王国",
        "第18ブロック：永遠の足跡"
    ];

    let allFrases = [];
    let currentFilteredFrases = [];
    let currentIndex = parseInt(sessionStorage.getItem('pyfp_jp_index') || '0', 10);
    let animationFrameId = null;
    let currentVideoElem = null;

    let canvas, ctx, blockSelect, prevBtn, nextBtn, randomBtn, homeBtn, huellaCounter, loadingElem;

    function populateSelect() {
        if (!blockSelect) return;
        const currentVal = sessionStorage.getItem('pyfp_jp_block') || "1";
        blockSelect.innerHTML = "";
        blockNamesJP.forEach((name, index) => {
            const opt = document.createElement('option');
            opt.value = (index + 1).toString();
            opt.textContent = name;
            if ((index + 1).toString() === currentVal) {
                opt.selected = true;
            }
            blockSelect.appendChild(opt);
        });
    }

    async function loadData() {
        if (loadingElem) {
            loadingElem.style.display = 'block';
            loadingElem.textContent = "読み込み中...";
        }
        try {
            const response = await fetch('frases.json?t=' + Date.now());
            if (!response.ok) throw new Error("Error HTTP " + response.status);
            allFrases = await response.json();
            if (loadingElem) loadingElem.style.display = 'none';

            let activeBlock = sessionStorage.getItem('pyfp_jp_block') || "1";
            if (blockSelect) blockSelect.value = activeBlock;

            filterByBlock(parseInt(activeBlock, 10), true);
        } catch (error) {
            console.error("Error al cargar datos:", error);
            if (loadingElem) {
                loadingElem.style.display = 'block';
                loadingElem.textContent = "frases.json の読み込みに失敗しました";
            }
        }
    }

    function filterByBlock(blockNum, keepIndex = false) {
        sessionStorage.setItem('pyfp_jp_block', blockNum.toString());
        currentFilteredFrases = allFrases.filter(f => Number(f.bloque || f.block) === Number(blockNum));
        
        if (!keepIndex) {
            currentIndex = 0;
        } else {
            const savedIndex = parseInt(sessionStorage.getItem('pyfp_jp_index') || '0', 10);
            currentIndex = (savedIndex < currentFilteredFrases.length) ? savedIndex : 0;
        }

        if (currentFilteredFrases.length === 0) {
            stopAnimation();
            if (huellaCounter) huellaCounter.textContent = "このブロックに足跡はありません";
            if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
        }

        renderCurrentHuella();
    }

    function stopAnimation() {
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
        if (currentVideoElem) {
            currentVideoElem.pause();
            currentVideoElem.removeAttribute('src');
            currentVideoElem.load();
            currentVideoElem = null;
        }
    }

    function renderCurrentHuella() {
        if (currentFilteredFrases.length === 0) return;

        stopAnimation();
        sessionStorage.setItem('pyfp_jp_index', currentIndex.toString());

        const item = currentFilteredFrases[currentIndex];
        const currentBlockNum = Number(item.bloque || item.block);

        if (huellaCounter) {
            huellaCounter.textContent = `足跡 ${item.id} (${currentIndex + 1} / ${currentFilteredFrases.length})`;
        }
        if (prevBtn) prevBtn.disabled = currentIndex === 0;
        if (nextBtn) nextBtn.disabled = currentIndex === currentFilteredFrases.length - 1;

        const imgPath = `plantilla${currentBlockNum}_jp.png`;
        const videoPath = `plantilla${currentBlockNum}_video_jp.mp4`;

        const bgImg = new Image();
        bgImg.src = imgPath;

        bgImg.onload = () => {
            adjustCanvasSize(bgImg.naturalWidth, bgImg.naturalHeight);
            drawCanvasFrame(bgImg, item.texto);
            tryLoadVideo(videoPath, item.texto, bgImg);
        };

        bgImg.onerror = () => {
            drawTextOnly(item.texto);
        };
    }

    function adjustCanvasSize(width, height) {
        if (!canvas) return;
        canvas.width = width || 1080;
        canvas.height = height || 1350;
    }

    function tryLoadVideo(videoSrc, text, fallbackImg) {
        const video = document.createElement('video');
        video.src = videoSrc;
        video.muted = true;
        video.loop = true;
        video.autoplay = true;
        video.playsInline = true;
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('muted', '');

        video.onloadeddata = () => {
            currentVideoElem = video;
            if (video.videoWidth && video.videoHeight) {
                adjustCanvasSize(video.videoWidth, video.videoHeight);
            }
            video.play().then(() => {
                function loop() {
                    if (currentVideoElem === video && ctx && canvas) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        drawTextOverlay(text);
                        animationFrameId = requestAnimationFrame(loop);
                    }
                }
                loop();
            }).catch(() => {
                // Si el navegador móvil bloquea el autoplay, se queda con la imagen estática de respaldo
                drawCanvasFrame(fallbackImg, text);
            });
        };

        video.onerror = () => {
            drawCanvasFrame(fallbackImg, text);
        };
        
        video.load();
    }

    function drawCanvasFrame(bgImg, text) {
        if (!ctx || !canvas) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        drawTextOverlay(text);
    }

    function drawTextOnly(text) {
        if (!ctx || !canvas) return;
        adjustCanvasSize(1080, 1350);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawTextOverlay(text);
    }

    function drawTextOverlay(text) {
        if (!ctx || !canvas || !text) return;
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const maxWidth = canvas.width * 0.75;
        const lineHeight = canvas.height * 0.055;
        const x = canvas.width / 2;
        const y = canvas.height * 0.46;

        let fontSize = Math.round(canvas.width * 0.038);
        if (text.length > 30) fontSize = Math.round(canvas.width * 0.034);
        if (text.length > 60) fontSize = Math.round(canvas.width * 0.030);

        ctx.font = `400 ${fontSize}px 'Montserrat', sans-serif`;

        let lines = [];
        let currentLine = "";

        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            let testLine = currentLine + char;
            if (ctx.measureText(testLine).width > maxWidth && currentLine !== "") {
                lines.push(currentLine);
                currentLine = char;
            } else {
                currentLine = testLine;
            }
        }
        if (currentLine) {
            lines.push(currentLine);
        }

        const totalHeight = lines.length * lineHeight;
        let startY = y - (totalHeight / 2) + (lineHeight / 2);

        lines.forEach((line, index) => {
            ctx.fillText(line, x, startY + (index * lineHeight));
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        canvas = document.getElementById('cardCanvas');
        ctx = canvas ? canvas.getContext('2d') : null;
        blockSelect = document.getElementById('blockSelect');
        prevBtn = document.getElementById('prevBtn');
        nextBtn = document.getElementById('nextBtn');
        randomBtn = document.getElementById('randomBtn');
        homeBtn = document.getElementById('homeBtn');
        huellaCounter = document.getElementById('huellaCounter');
        loadingElem = document.getElementById('loading');

        populateSelect();

        // Desbloqueo táctil para navegadores móviles estrictos
        document.addEventListener('touchstart', function unlockVideo() {
            if (currentVideoElem && currentVideoElem.paused) {
                currentVideoElem.play().catch(() => {});
            }
        }, { once: true });

        if (homeBtn) {
            homeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = "https://palabrasyfrasesperdidas-dotcom.github.io/palabrasyfrasesperdidas/";
            });
        }

        if (blockSelect) {
            blockSelect.addEventListener('change', (e) => {
                filterByBlock(parseInt(e.target.value, 10), false);
            });
        }

        if (prevBtn) {
            prevBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentIndex > 0) {
                    currentIndex--;
                    renderCurrentHuella();
                }
            });
        }

        if (nextBtn) {
            nextBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentIndex < currentFilteredFrases.length - 1) {
                    currentIndex++;
                    renderCurrentHuella();
                }
            });
        }

        if (randomBtn) {
            randomBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (allFrases.length === 0) return;
                const randomIndex = Math.floor(Math.random() * allFrases.length);
                const randomItem = allFrases[randomIndex];
                const blockValue = Number(randomItem.bloque || randomItem.block);
                
                blockSelect.value = blockValue.toString();
                currentFilteredFrases = allFrases.filter(f => Number(f.bloque || f.block) === blockValue);
                currentIndex = currentFilteredFrases.findIndex(f => f.id === randomItem.id);
                if (currentIndex === -1) currentIndex = 0;
                renderCurrentHuella();
            });
        }

        loadData();
    });
</script>
</body>
</html>
